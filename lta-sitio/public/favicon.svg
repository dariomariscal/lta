<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2400">
  <!-- Favicon LTA — mismo trazo de la marca del nav (src/assets/lta-marca.svg),
       centrado en un lienzo cuadrado con fondo oscuro de marca. El gris del nav
       usa currentColor; aquí se fija al claro de marca para contraste en la pestaña. -->
  <rect width="2400" height="2400" fill="#0E0E0D"/>
  <g transform="translate(205 727.5)">
    <!-- L + T + A (una sola figura, contador interno recortado) -->
    <path
      fill="#F2F0EC"
      fill-rule="evenodd"
      d="M0 0 V945 H849 V376 H566 V189 H1444 L1697 752 H1339 L1250 945 H1990 L1573 0 H377 V566 H655 V752 H190 V0 Z"
    />
    <!-- Acento rojo: triángulo delgado (asta interior) -->
    <path fill="#C8462F" d="M1039 376 H1299 L1039 858 Z" />
  </g>
</svg>
